[package]
name = "stm32_shooter"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

embassy-executor = { version = "0.6.0", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.3.2", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-1_000_000"] }
embassy-stm32 = { version = "0.1.0", features = [
    "defmt",
    "stm32f767zi",
    "memory-x",
    "time-driver-any",
    "exti",
] }

pid-lite = "0.1.0" # Lightweight PID controller
