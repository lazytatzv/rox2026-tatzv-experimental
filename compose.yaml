include:
  - path: ${COMPOSE_GPU_FILE:-compose.null.yaml}

services:
  ros2_rox2026:
    image: ghcr.io/lazytatzv/rox2026-tatzv-experimental:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_BUILD_TARGET:-dev} # Switch between 'dev' and 'prod'
      network: host
    container_name: rox2026_container
    # Ports are used on macOS/Windows (bridge mode) and ignored on Linux (host mode)
    ports:
      - "6080:6080" # noVNC
      - "8765:8765" # Foxglove Bridge
    init: true
    stdin_open: true
    tty: true
    privileged: true # Dangerous, but necessary for convenient hardware access.
    network_mode: ${DOCKER_NETWORK_MODE:-host}
    ipc: host

    environment:
      ROS_DOMAIN_ID: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTRTPS_DEFAULT_PROFILES_FILE: /root/lazytatzv_ws/main_ws/src/bringup/robot_bringup/config/fastdds_config.xml
      DEBIAN_FRONTEND: noninteractive
      # GUI Support
      # Linux: defaults to :0 (host) via Makefile if DISPLAY is set
      # macOS: defaults to :1 (VNC)
      DISPLAY: ${DISPLAY:-:2}
      QT_X11_NO_MITSHM: "1"
      # NVIDIA GPU Support (Linux Only)
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all

    # NVIDIA GPU support is now optional.
    # It is automatically included via the 'include' directive if COMPOSE_GPU_FILE
    # is set to compose.gpu.yaml (handled by Makefile/Dev Containers).

    volumes:
      - .:/root/lazytatzv_ws
      - ./.ccache:/root/.ccache:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority_host:ro

    devices:
      - /dev:/dev
      - /dev/dri:/dev/dri # GPU acceleration for Intel/AMD

    shm_size: '2gb' # Increase shared memory for Foxglove/RViz
    working_dir: /root/lazytatzv_ws
    command: bash
