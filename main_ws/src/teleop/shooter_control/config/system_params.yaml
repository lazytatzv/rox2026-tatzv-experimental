# Unified Shooter System Parameters
shooter_teleop:
  ros__parameters:
    enable_button: 6
    high_button: 2
    medium_button: 1
    low_button: 0
    high_rpm: 5000.0
    medium_rpm: 3000.0
    low_rpm: 1000.0
    stop_rpm: 0.0
    topic_joy: '/joy'
    topic_shooter_cmd: '/shooter/cmd_joy'

shooter_mux:
  ros__parameters:
    teleop_timeout: 0.5
    topic_cmd_joy: '/shooter/cmd_joy'
    topic_cmd_auto: '/shooter/cmd_auto'
    topic_cmd_muxed: '/shooter/cmd_muxed'

auto_shooter:
  ros__parameters:
    poly_a: 15.0
    poly_b: 100.0
    poly_c: 1500.0
    max_rpm: 7500.0
    min_rpm: 0.0
    topic_distance: '/target/distance'
    topic_shooter_cmd: '/shooter/cmd_auto'

spring_controller:
  ros__parameters:
    reload_speed: 15.0
    fire_speed: 20.0
    joy_l2_index: 6
    joy_r1_index: 5
    control_hz: 100.0
    topic_joy: '/joy'
    topic_limit_switch: '/shooter/limit_switch'
    topic_speed_out: '/edulite_speed'

mad_motor_driver_node:
  ros__parameters:
    cmd_id: 0x201          # RDK -> STM32 (Actuator Control)
    imu_id: 0x202          # STM32 <-> RDK (IMU Data)
    limit_switch_id: 0x200 # STM32 -> RDK (Switch States)
    watchdog_timeout: 0.5
    invert_top: false
    invert_bottom: true
    backspin_ratio: 1.2
    imu_source: "stm32"
