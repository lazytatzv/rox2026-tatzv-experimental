# robot_localization EKF configuration
# "The Statistical Master of Self-Location"

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true

    map_frame: map              # Defaults to "map"
    odom_frame: odom            # Defaults to "odom"
    base_link_frame: base_footprint # Defaults to "base_link"
    world_frame: odom           # Defaults to "odom"

    # Wheel Odometry (from mecanum_kinematics)
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: odom/wheels
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    # IMU (from Gazebo/BNO055)
    imu0: imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  true,  true,  false]
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true

    use_control: false
