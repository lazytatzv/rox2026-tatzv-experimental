# twist_mux configuration for ROX2026
twist_mux:
  ros__parameters:
    use_stamped: true
    topics:
      teleop:
        topic: "cmd_vel_joy"
        timeout: 2.0 # Relaxed to handle any web-induced latency
        priority: 100
      navigation:
        topic: "cmd_vel_nav"
        timeout: 2.0
        priority: 10
      external:
        topic: "cmd_vel_ext"
        timeout: 2.0
        priority: 5
      # Persistent baseline
      idle:
        topic: "cmd_vel_idle"
        timeout: 10.0 # Long but finite to ensure stability
        priority: 1

    locks:
      e_stop:
        topic: "stop_lock"
        timeout: 0.0
        priority: 255
