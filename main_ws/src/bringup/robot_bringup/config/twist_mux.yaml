# twist_mux configuration for ROX2026 (Jazzy/Humble Compatible Map Format)
twist_mux:
  ros__parameters:
    topics:
      teleop:
        topic: "cmd_vel_joy"
        timeout: 0.5
        priority: 100
      navigation:
        topic: "cmd_vel_nav"
        timeout: 0.5
        priority: 10
      external:
        topic: "cmd_vel_ext"
        timeout: 0.5
        priority: 5

    locks:
      e_stop:
        topic: "stop_lock"
        timeout: 0.0
        priority: 255
