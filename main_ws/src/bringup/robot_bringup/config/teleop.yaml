# Teleoperation and Input settings for ROX2026
/joystick_driver_node:
  ros__parameters:
    deadzone: 0.1
    autorepeat_rate: 20.0

/base_teleop:
  ros__parameters:
    # --- 3-Axis Pro Mapping (DualSense Standard) ---
    joy_axis_linear_x: 1    # Left Stick Vertical
    joy_axis_linear_y: 0    # Left Stick Horizontal (Strafe)
    joy_axis_angular_z: 2   # Right Stick Horizontal (Rotation)

    # Button Mappings
    joy_button_software_stop: 15  # Touchpad Click
    joy_button_joy_mode_on: 8     # Create (Select)

    # Sensitivities
    scale_linear_velocity: 1.5    # Increased for heavier 50kg robot
    scale_angular_velocity: 2.0   # Snappy rotation
    smoothing_factor: 0.3

    # Topics
    topic_joy: "joy"
    topic_cmd_vel: "cmd_vel_joy"
    topic_stop_lock: "stop_lock"
