# Teleoperation and Input settings for ROX2026
/joystick_driver_node:
  ros__parameters:
    deadzone: 0.1
    autorepeat_rate: 20.0

/base_teleop:
  ros__parameters:
    # --- 3-Axis Pro Mapping (DualSense Standard) ---
    joy_axis_linear_x: 1    # Left Stick Vertical
    joy_axis_linear_y: 0    # Left Stick Horizontal (Strafe)
    joy_axis_angular_z: 2   # Right Stick Horizontal (Rotation)

    # Button Mappings
    joy_button_software_stop: 15  # Touchpad Click
    joy_button_joy_mode_on: 6     # Share / Back / View

    # Sensitivities
    scale_linear_velocity: 1.0
    scale_angular_velocity: 0.4   # Precision tuned for EduLite 05
    smoothing_factor: 1.0         # Snappy stop performance

    # Topics
    topic_joy: "joy"
    topic_cmd_vel: "cmd_vel_joy"
    topic_stop_lock: "stop_lock"
# twist_mux configuration for ROX2026
twist_mux:
  ros__parameters:
    use_stamped: true
    topics:
      teleop:
        topic: "cmd_vel_joy"
        timeout: 2.0 # Relaxed to handle any web-induced latency
        priority: 100
      navigation:
        topic: "cmd_vel_nav"
        timeout: 2.0
        priority: 10
      external:
        topic: "cmd_vel_ext"
        timeout: 2.0
        priority: 90
      # Persistent baseline
      idle:
        topic: "cmd_vel_idle"
        timeout: 10.0 # Long but finite to ensure stability
        priority: 1

    locks:
      e_stop:
        topic: "stop_lock"
        timeout: 0.0
        priority: 255

# ==========================================
# 射出機構 (Shooter) 用の設定（最強の構成）
# ==========================================
/shooter_teleop:
  ros__parameters:
    # --- ボタン・軸の割り当て ---
    joy_button_fire: 1        # B / Circleボタン
    joy_button_charge: 3      # Y / Triangleボタン
    joy_axis_aim_pitch: 4     # 右スティック上下など

    # --- トピック設定 ---
    topic_joy: "joy"
    topic_shooter_cmd: "shooter/cmd_joy"  # Muxへ送る用のTopic

# 射出用のMux（自作Muxまたはtwist_muxの流用を想定）
shooter_mux:
  ros__parameters:
    topics:
      teleop:
        topic: "shooter/cmd_joy"   # 手動操作
        timeout: 0.5
        priority: 100              # 手動が最優先
      auto:
        topic: "shooter/cmd_auto"  # 自動制御（カメラ・AI等から）
        timeout: 0.5
        priority: 10               # 自動運転は優先度低め

