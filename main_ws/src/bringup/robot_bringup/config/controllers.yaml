# ros2_control configuration for ROX2026
# "The Ultimate Control Layer"

controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

mecanum_drive_controller:
  ros__parameters:
    # Kinematics
    reference_system: "base_footprint"
    front_left_wheel_name: "front_left_wheel_joint"
    front_right_wheel_name: "front_right_wheel_joint"
    rear_left_wheel_name: "rear_left_wheel_joint"
    rear_right_wheel_name: "rear_right_wheel_joint"

    wheel_separation_x: 0.25 # wheel_base in URDF
    wheel_separation_y: 0.30 # wheel_sep in URDF
    wheel_radius: 0.05

    # Odometry (Will be fused with IMU via EKF)
    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]
    open_loop: false
    enable_odom_tf: false # Important: EKF handles TF!

    # Limits
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 2.0
        has_acceleration_limits: true
        max_acceleration: 5.0
      y:
        has_velocity_limits: true
        max_velocity: 2.0
        has_acceleration_limits: true
        max_acceleration: 5.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 4.0
        has_acceleration_limits: true
        max_acceleration: 10.0

    # Topics
    publish_rate: 50.0
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
