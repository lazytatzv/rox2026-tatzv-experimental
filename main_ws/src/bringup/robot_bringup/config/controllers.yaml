# ros2_control configuration for ROX2026
# "The Ultimate Control Layer - STABILIZED"

controller_manager:
  ros__parameters:
    update_rate: 100

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

mecanum_drive_controller:
  ros__parameters:
    front_left_wheel_command_joint_name: "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_left_wheel_command_joint_name: "rear_left_wheel_joint"
    rear_right_wheel_command_joint_name: "rear_right_wheel_joint"

    kinematics:
      wheels_radius: 0.05
      sum_of_robot_center_projection_on_X_Y_axis: 0.52
      base_frame_offset: {x: 0.0, y: 0.0, theta: 0.0}

    use_stamped_vel: true
    reference_timeout: 0.5
    odom_frame_id: odom
    base_frame_id: base_footprint
    open_loop: false
    enable_odom_tf: false

    # Professional Limits (Required to avoid Velocity Injection cheating)
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 5.0
        has_acceleration_limits: true
        max_acceleration: 5.0
      y:
        has_velocity_limits: true
        max_velocity: 5.0
        has_acceleration_limits: true
        max_acceleration: 5.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 5.0
        has_acceleration_limits: true
        max_acceleration: 5.0

    enforce_joint_model_limits: true
