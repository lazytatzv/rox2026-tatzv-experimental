# ros2_control configuration for ROX2026
# "The Ultimate Control Layer"

controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

mecanum_drive_controller:
  ros__parameters:
    # Joint Names
    front_left_wheel_command_joint_name: "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_left_wheel_command_joint_name: "rear_left_wheel_joint"
    rear_right_wheel_command_joint_name: "rear_right_wheel_joint"

    # Kinematics
    kinematics:
      wheels_radius: 0.05
      sum_of_robot_center_projection_on_X_Y_axis: 0.275
      base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0

    # Controller Settings
    use_stamped_vel: true # Strictly required for Jazzy
    reference_timeout: 0.5
    
    # Odometry
    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal: [0.001, 0.001, 1.0e-6, 1.0e-6, 1.0e-6, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1.0e-6, 1.0e-6, 1.0e-6, 0.01]
    open_loop: false
    enable_odom_tf: false

    # Limits
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 2.0
        has_acceleration_limits: true
        max_acceleration: 5.0
      y:
        has_velocity_limits: true
        max_velocity: 2.0
        has_acceleration_limits: true
        max_acceleration: 5.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 4.0
        has_acceleration_limits: true
        max_acceleration: 10.0
