# Hardware IDs and Port Mapping
# Beginners: Change motor_ids here.
# Experts: Tune hardware-level limits.

hardware:
  usb_port: "/dev/ttyUSB0"
  protocol: "at" # 'at' or 'can'
  baud_rate: 921600
  can_interface_type: "serial" # 'serial' or 'ros_topic' (for socketcan / usb_can_analyzer via topic)

  motors:
    front_left:  {id: 1, invert: false}
    front_right: {id: 2, invert: false}
    rear_left:   {id: 3, invert: false}
    rear_right:  {id: 4, invert: false}
    bench_id: 1

  limits:
    max_velocity: 25.0 # rad/s
    max_effort: 6.0    # Nm
