# Hardware IDs and Port Mapping
# Beginners: Change motor_ids here.
# Experts: Tune hardware-level limits.

hardware:
  usb_port: "/dev/ttyUSB1"
  protocol: "at_gateway" # 'at_gateway' (via AT command bridge board) or 'native_can' (direct native CAN frames)
  baud_rate: 921600
  transport: "serial_port" # 'serial_port' (direct USB serial port) or 'socketcan' (via ros2_socketcan topic bridge)

  motors:
    front_left:  {id: 1, invert: true}
    front_right: {id: 2, invert: false}
    rear_left:   {id: 3, invert: true}
    rear_right:  {id: 4, invert: false}
    bench_id: 1

  limits:
    max_velocity: 25.0 # rad/s
    max_effort: 6.0    # Nm
