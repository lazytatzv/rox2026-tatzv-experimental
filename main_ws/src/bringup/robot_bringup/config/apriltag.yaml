/**:
    ros__parameters:
        image_transport: raw    # image format
        family: 16h5           # tag family name
        size: 0.18          # tag edge size in meter
        remove_calibrated_check: true  # skip calibration checks
        max_hamming: 1          # maximum allowed hamming distance (1 corrects minor errors for extreme robustness)
        qos_profile: sensor_data # low-latency UDP-like delivery for real-time vision

        # see "apriltag.h" 'struct apriltag_detector' for more documentation on these optional parameters
        detector:
            threads: 4          # multi-threading for maximum FPS (4+ threads recommended)
            decimate: 1.0       # 1.0 for maximum range/accuracy, or 2.0 for speed. We use 1.0 since threads=4 can handle the load.
            blur: 0.0           # sigma of Gaussian blur for quad detection
            refine: True        # snap to strong gradients
            sharpening: 0.25    # sharpening of decoded images
            debug: False        # write additional debugging images to current working directory


        pose_estimation_method: "pnp"   # method for estimating the tag pose
        publish_tf: true                # publish TF frames for detected tags (crucial for tag_localizer)

        # optional list of tags
        #tag:
        #    ids: [9, 14]            # tag ID
        #    frames: [base, object]  # optional frame name
        #    sizes: [0.162, 0.162]   # optional tag-specific edge size