# ros_gz_bridge configuration
# "The Strongest Way to Sync ROS 2 and Gazebo"

- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Dynamic Scene Integration (The Magic)
- ros_topic_name: "/gz_scene"
  gz_topic_name: "/world/obstacle_world/scene/info"
  ros_type_name: "gz_msgs/msg/Scene" # Requires ros_gz_interfaces
  gz_type_name: "gz.msgs.Scene"
  direction: GZ_TO_ROS
