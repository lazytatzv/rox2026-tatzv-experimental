# Communication Bridge Settings

/serial_driver:
  ros__parameters:
    device_name: "/dev/ttyUSB1"
    baud_rate: 921600
    flow_control: "none"
    parity: "none"
    stop_bits: "1"

/usb_can_analyzer_node:
  ros__parameters:
    usb_path: "/dev/ttyUSB1"
    serial_baud: 2000000
    bitrate: 500000
    tx_extended: false
    filter_id: 0
    mask_id: 0
    operation_mode: 0

/socket_can_receiver:
  ros__parameters:
    interface: "vcan0"
    enable_can_fd: false

/socket_can_sender:
  ros__parameters:
    interface: "vcan0"
    enable_can_fd: false
    timeout_sec: 0.01
# Centralized Sensor Configuration for ROX2026
bno055_node:
  ros__parameters:
    i2c_bus: "/dev/i2c-1"
    i2c_addr: 0x28
    frame_id: "imu_link"
    variance_orientation: 0.001
    variance_angular_velocity: 0.01
    variance_linear_acceleration: 0.1
