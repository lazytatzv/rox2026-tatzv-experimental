name: ROX2026 CI (Docker-Native)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker_build_and_test:
    name: Build & Verify (Multi-stage)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build the Builder/Dev stage and Run Tests
      # This ensures all source code compiles and logic tests pass in the exact dev environment
      - name: Build Dev Stage and Test
        run: |
          docker build \
            --target builder \
            --tag rox2026:builder \
            --build-arg ROS_DISTRO=jazzy \
            .
          
          # Run tests inside the built image
          docker run --rm rox2026:builder /bin/bash -c "source /opt/ros/jazzy/setup.bash && cd main_ws && colcon test && colcon test-result --verbose"

      # 2. Build the Prod stage
      # This ensures the final lightweight image can be correctly assembled for the robot
      - name: Verify Prod Stage Build
        run: |
          docker build \
            --target prod \
            --tag rox2026:prod \
            --build-arg ROS_DISTRO=jazzy \
            .

      - name: Build Success Summary
        if: success()
        run: echo ">>> All stages (Builder, Dev, Prod) verified successfully. CI Passed."
